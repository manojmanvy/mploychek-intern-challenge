<div class="login-page">
  <!-- Background decoration -->
  <div class="background-glow glow-one"></div>
  <div class="background-glow glow-two"></div>
  <div class="background-grid"></div>

  <main class="login-container">

    <!-- Brand -->
    <header class="brand-header">
      <div class="brand-icon">
        <span> M </span>
      </div>

      <div class="brand-name">
        <h1>MPloy<span>Chek</span></h1>
        <p>PEOPLE. PROCESS. PROGRESS.</p>
      </div>

      <div class="system-status">
        <span class="status-dot"></span>
        SECURE PORTAL
      </div>
    </header>

    <!-- Login card -->
    <section class="login-card">

      <div class="card-top">
        <div class="welcome-badge">
          <span class="welcome-icon">✦</span>
          YOUR WORKSPACE AWAITS
        </div>

        <h2>Welcome<br />back<span class="heading-dot">.</span></h2>

        <p class="welcome-description">
          Sign in to access your workspace and<br class="desktop-break" />
          manage everything in one place.
        </p>
      </div>

      <!-- Error message -->
      <div class="error-banner" *ngIf="errorMessage">
        <span class="error-icon">!</span>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Login form -->
      <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">

        <div class="form-group">
          <label for="userId">USER ID</label>

          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path>
              </svg>
            </span>

            <input
              id="userId"
              type="text"
              name="userId"
              [(ngModel)]="userId"
              placeholder="Enter your user ID"
              autocomplete="username"
              required
              [disabled]="loading"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">PASSWORD</label>

          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none">
                <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                <path d="M12 14v3"></path>
              </svg>
            </span>

            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              [(ngModel)]="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
              [disabled]="loading"
            />

            <button
              class="password-toggle"
              type="button"
              (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
              [disabled]="loading"
            >
              <svg
                *ngIf="!showPassword"
                viewBox="0 0 24 24"
                fill="none"
              >
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>

              <svg
                *ngIf="showPassword"
                viewBox="0 0 24 24"
                fill="none"
              >
                <path d="m3 3 18 18"></path>
                <path d="M10.6 5.2A10 10 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-3.1 3.9"></path>
                <path d="M6.2 6.3C3.5 8.2 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="role">ACCOUNT ROLE</label>

          <div class="input-wrapper role-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 3 20 7v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4Z"></path>
                <path d="m9 12 2 2 4-4"></path>
              </svg>
            </span>

            <select
              id="role"
              name="role"
              [(ngModel)]="role"
              required
              [disabled]="loading"
            >
              <option value="user">General User</option>
              <option value="admin">Administrator</option>
            </select>

            <span class="select-arrow">⌄</span>
          </div>
        </div>

        <button
          class="login-button"
          type="submit"
          [disabled]="loginForm.invalid || loading"
        >
          <span *ngIf="!loading" class="button-content">
            <span>Access workspace</span>
            <span class="button-arrow">↗</span>
          </span>

          <span *ngIf="loading" class="button-content loading-content">
            <span class="spinner"></span>
            <span>Authenticating...</span>
          </span>
        </button>

      </form>

      <!-- Security information -->
      <div class="security-note">
        <span class="security-icon">✓</span>
        <span>Your session is protected by secure authentication.</span>
      </div>

    </section>

    <!-- Footer -->
    <footer class="page-footer">
      <div class="footer-line"></div>

      <p>
        BUILT FOR BETTER WORKFLOWS
        <span class="footer-separator">·</span>
        <span class="footer-year">MPLOYCHEK</span>
      </p>

      <div class="footer-line"></div>
    </footer>

  </main>
</div>
